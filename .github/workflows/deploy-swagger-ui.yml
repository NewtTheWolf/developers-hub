name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'api-reference/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # api-reference/ is a complete, self-contained Swagger UI bundle
      # (branded UI + multi-file spec: turbo-smtp.yaml + Domains/*.yaml),
      # synced from ../turbo-smtp-openapi/turbo-api-2/. Publish it verbatim —
      # relative asset and $ref paths resolve at the Pages site root.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-reference

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
