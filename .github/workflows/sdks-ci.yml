# Lint, typecheck, build and test the SDK packages.
#
# The rest of the repository is documentation and a generated spec bundle, covered
# by validate-openapi.yml, so this workflow is scoped to paths under sdks/.
name: SDKs CI

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the live smoke tests (sends real email)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'biome.json'
      - '.github/workflows/sdks-ci.yml'
  pull_request:
    paths:
      - 'sdks/**'
      - 'biome.json'
      - '.github/workflows/sdks-ci.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned exactly, not floated: this is a merge gate, and a Biome minor adding a
      # rule to `recommended` would redden pull requests that never touched the files
      # it fails on (ADR-0004 rules 1-3). Keep in step with biome.json's $schema.
      - run: npx --yes @biomejs/biome@2.5.4 ci sdks

  # Both ends of what the packages promise: `engines` says >=22, so 22 is the claim
  # under test and 24 is the active LTS consumers install today. The build toolchain
  # runs on both (typescript >=16.20, esbuild >=18), so no artifact hand-off is needed.
  # This verifies the source tree, not the tarball; ADR-0004 rule 4's artifact-based
  # check is still owed (ADR-0011 decision 3).
  test:
    name: Test ${{ matrix.package }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [node, node-webhook]
        node: [22, 24]
    defaults:
      run:
        working-directory: sdks/packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/packages/${{ matrix.package }}/package-lock.json
      # `prepare` would build on install and `pretest` builds again; skipping
      # install scripts keeps it to one build.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  examples:
    name: Typecheck examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/packages/node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:examples

  # Sends real email, so it never runs automatically. GitHub does not expose secrets
  # to pull_request runs from a fork, so this could not work there in any case.
  live:
    name: Live smoke tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    environment: live-smoke
    defaults:
      run:
        working-directory: sdks/packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/packages/node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:live
        env:
          TURBOSMTP_CONSUMER_KEY: ${{ secrets.TURBOSMTP_CONSUMER_KEY }}
          TURBOSMTP_CONSUMER_SECRET: ${{ secrets.TURBOSMTP_CONSUMER_SECRET }}
          TURBOSMTP_TEST_FROM: ${{ vars.TURBOSMTP_TEST_FROM }}
          TURBOSMTP_TEST_TO: ${{ vars.TURBOSMTP_TEST_TO }}
