name: Split packages to publish mirrors

# Publishing topology "C+" — see sdks/plan.md decision #2 and sdks/TASKS.md 4.7.
#
# developers-hub is the only repo anyone commits to. A release tag pushes that one
# package's subtree to its read-only mirror, which is what npm / pkg.go.dev / Packagist
# link to and (for Go and PHP) actually consume.
#
# Tag convention:  <package>/vX.Y.Z  here  ->  vX.Y.Z  on the mirror.
# The prefix is a package slug, not a language: it equals the language for the five
# unified SDKs only because each one is that language's single publishable unit.
# The mirror tag MUST be unprefixed: Go resolves versions from root-module tags, and
# Packagist reads composer.json from the repository root. That translation is the whole
# reason this workflow exists.
#
# Requires a secret `MIRROR_TOKEN` — a PAT or GitHub App installation token with
# `contents: write` on the five turbosmtp-* mirror repos.

on:
  push:
    tags:
      - 'node/v*'
      - 'python/v*'
      - 'csharp/v*'
      - 'go/v*'
      - 'php/v*'
      - 'node-webhook/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing <package>/vX.Y.Z tag to (re-)split'
        required: true

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds on a missing secret rather than after the split, and never
      # print the value — only its length, which is enough to tell empty from set.
      - name: Verify MIRROR_TOKEN is present
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN is empty or unset. Set it under developers-hub → Settings → Secrets and variables → Actions. Note that a non-interactive \`gh secret set\` can store an empty value."
            exit 1
          fi
          echo "MIRROR_TOKEN present (${#MIRROR_TOKEN} chars)"

      - uses: actions/checkout@v4
        with:
          # `git subtree split` replays the directory's whole history — a shallow
          # clone silently produces a truncated mirror.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Do NOT leave GITHUB_TOKEN credentials in .git/config. Otherwise a bad or
          # empty MIRROR_TOKEN falls back to them silently and the push fails as an
          # opaque "denied to github-actions[bot]" 403 instead of an auth error —
          # observed on run 31105171893.
          persist-credentials: false

      - name: Resolve package, version and mirror from the tag
        id: target
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="${tag%%/*}"
          version="${tag#*/}"
          case "$pkg" in
            node)         mirror=turbosmtp-node ;;
            python)       mirror=turbosmtp-python ;;
            csharp)       mirror=turbosmtp-dotnet ;;
            go)           mirror=turbosmtp-go ;;
            php)          mirror=turbosmtp-php ;;
            node-webhook) mirror=turbosmtp-node-webhook ;;
            *) echo "::error::Unrecognised package prefix '$pkg' in tag '$tag'"; exit 1 ;;
          esac
          if [ "$version" = "$tag" ]; then
            echo "::error::Tag '$tag' is not in <package>/vX.Y.Z form"; exit 1
          fi
          {
            echo "pkg=$pkg"
            echo "version=$version"
            echo "mirror=$mirror"
            echo "prefix=sdks/packages/$pkg"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the package directory exists
        run: test -d "${{ steps.target.outputs.prefix }}"

      - name: Split the package subtree
        id: split
        run: |
          set -euo pipefail
          sha="$(git subtree split --prefix=${{ steps.target.outputs.prefix }})"
          echo "Split ${{ steps.target.outputs.prefix }} -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Push subtree and translated tag to the mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${{ github.repository_owner }}/${{ steps.target.outputs.mirror }}.git"
          git push --force "$remote" "${{ steps.split.outputs.sha }}:refs/heads/main"
          git push --force "$remote" "${{ steps.split.outputs.sha }}:refs/tags/${{ steps.target.outputs.version }}"
          echo "Mirrored ${{ steps.target.outputs.pkg }} as ${{ steps.target.outputs.mirror }}@${{ steps.target.outputs.version }}"
