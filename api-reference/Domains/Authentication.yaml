# OpenAPI version identifier - required for OpenAPI 3.1 domains
openapi: 3.1.0

#######################
# Optional info section
#######################
info:
  title: Authentication Components
  description: Authentication components for TurboSMTP REST APIs
  version: '1.0.0-oas3'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

security:
  - ApiKeyAuth: []

components: 
  
  ####################
  # Common path items
  ####################
  pathItems:
    authorize:
      post:
        security: []
        tags:
          - authentication
        summary: Login - Get API Key
        operationId: AuthenticationLogin
        description: |
          **This endpoint allows you to get an API Key**
          
          By providing your turboSMTP authentication details you will be able to get an API Key.
          
          Use your API Key to consume APIs that require authorization.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationLoginRequestBody'
        responses:
          '200':
            description: | 
              Sucess
              
              User logged in sucessfully, use the auth value as API Key from request body in future API calls.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthenticationLoginSuccessResponsetBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * missing_required_parameter
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '403':
            description: |
              Forbidden
            
              Email address or password provided are incorrect.

              ###### Produces: 
              
              * wrong_credentials_specified
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example: 
                  message: "wrong_credentials_specified"

    deauthorize:
      post:
        tags:
          - authentication
        summary: Logout - Revoke API Key
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]          
        operationId: AuthenticationLogout
        description: |
          **This endpoint allows you to revoke your API Key**
        responses:
          '200':
            description: | 
              Sucess
              
              User logged out sucessfully, API Key is no longer valid.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example:
                  message: "token_deauthorized"
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

    changepassword:
      put:
        tags:
          - authentication
        summary: Change turboSMTP password
        security:
          - ApiKeyAuth: [ ]
        operationId: ChangePassword
        description: |
          **This endpoint allows you to change your current password**

          Note: Only ApiKeyAuth is supported. ConsumerKey/ConsumerSecret authentication will return 403.
          
          ## PASSWORD RULES
          
            * Passwords must have at least 10 characters.
            * At least one character must be uppercase.
            * At least one character must be lowercase.
            * At least one character must be numeric.
          
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordRequestBody'
        responses:
          '200': 
            description: | 
              Sucess
              
              Password changed sucessfully.   
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'            
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * invalid_mail_address
              * current_password_is_missing
              * current_password_can_not_be_empty
              * password_is_missing
              * password_length_should_not_be_less_than_10_characters
              * password_should_contain_at_least_one_uppercase_character
              * password_should_contain_at_least_one_lowercase_character
              * password_should_contain_at_least_one_digit
              * confirm_password_is_missing
              * password_should_equal_confirm_password
              * new_password_should_not_equal_current_password            
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ChangePasswordBadRequestResponseBody'

          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            description: |
              Forbidden
            
              Current password provided is incorrect.

              ###### Produces: 
              
              * password_is_invalid
              * not_allowed_for_apikey
              
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example: 
                  message: "password_is_invalid"

    forgotpassword:
      post:
        security: []
        tags:
          - authentication
        summary: Forgot Password - Use in case you don´t remember your turboSMTP password
        operationId: SendSecretTokenResetPassword
        description: |
          **This endpoint will allow you to get an email that will help you reset your turboSMTP password**
          
          In your password reset email you will find:
          
          * A **Reset Password** button that will take you to the password reset form on turboSMTP website.
          * A secret token to be used to reset the password via [/authentication/forgot-password](#/authentication/updateResetPassword). **Note**: Token is vaid for 1 hour.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSecretTokenResetPasswordRequestBody'        
        responses:      
            '200': 
              description: |
                Success

                Password reset email sent if the address is registered. Always returns success to prevent email enumeration.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
            '400':
              description: |
                Bad Request

                ###### Produces:

                * empty_request_body
                * missing_required_parameter
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/SendSecretTokenResetPasswordBadRequestResponseBody'
      get:
        tags:
          - authentication
        summary: Forgot Password - Verify if Secret Passord Recovery token is valid.
        security:
          - ApiKeyAuth: [ ]
        operationId: CheckValidityTokenResetPassword
        parameters:
          - name: token
            in: query
            description: Secret Token
            required: true
            schema:
              type: string
        description: |
          Forgot Password - check if secret token is valid
          
          **Note**: Tokens are valid for 1 hour.
        responses:
          '200': 
              description: | 
                Sucess
              
                Token is valid.  
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '400':
              description: |
                Bad Request
              
                ###### Produces:
              
                * forgot_password_token_is_missing
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CheckValidityTokenResetPasswordBadRequestResponseBody'
                    
          '403':
              description: | 
                Forbidden
              
                Token is invalid. 
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "token_is_invalid"
      put:
        security: []        
        tags:
          - authentication
        summary: Forgot Password - change password
        operationId: UpdateResetPassword
        description: |
          **This endpoint allows you to reset your password by using a password reset token**
          
          ## PASSWORD RULES
          
            * Passwords must have at least 10 characters.
            * At least one character must be uppercase.
            * At least one character must be lowercase.
            * At least one character must be numeric.
          
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResetPasswordRequestBody'
        responses:
          '200': 
            description: | 
              Sucess
              
              Password reset sucessfully.   
            content:
              application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * empty_request_body
              * token_is_missing
              * token_can_not_be_empty
              * password_is_missing
              * password_length_should_not_be_less_than_10_characters
              * password_should_contain_at_least_one_uppercase_character
              * password_should_contain_at_least_one_lowercase_character
              * password_should_contain_at_least_one_digit
              * confirm_password_is_missing
              * password_should_equal_confirm_password
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UpdateResetPasswordBadRequestResponseBody'         
          '403':
              description: | 
                Forbidden
              
                Token is invalid.  
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "token_is_invalid"

  ####################
  # Common data models
  ####################
  schemas:
  
   #AuthenticationLogin
    AuthenticationLoginRequestBody:
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  description: The email of turboSMTP account
                password:
                  type: string
                  writeOnly: true
                  description: The password of turboSMTP account
                no_expire:
                  type: boolean
                  default: false
                  description: "
                  **false**: 
                  \nauthentication will expire after 2 hours.
                  
                  \n**true**: 
                  \nauthentication will keep you signed in, and will never expire.
                  (Use [/authentication/deauthorize](#/authentication/AuthenticationLogout) to logout and release your an API Key)"
              required:
                - email
                - password
              example: 
                email: "developer@yourdomain.com"
                password: "yourTurboSmtpPassword"
                no_expire: true
    
    AuthenticationLoginSuccessResponsetBody:
              properties:
                  auth:
                    type: string
                    description: "API Key to be used in authorization header"
              example: 
                auth: "f8efa7be4e7457c463e8b800e1f11f92072d272c"  

   #ChangePassword  
    ChangePasswordRequestBody:
      additionalProperties: false
      properties:
        current_password:
          type: string
          description: Current Password.
        password:
          type: string
          description: New Password to be used.
        confirm_password:
          type: string
          description: New Password to be used.
      required:
        - current_password
        - password
        - confirm_password
      example:
        current_password: "6SwHbc96dyE8"
        password: "SMkhhf4J686P"
        confirm_password: "SMkhhf4J686P"
        
    ChangePasswordBadRequestResponseBody:
                  additionalProperties: false
                  properties:
                    message:
                      type: string
                      enum: [ 
                        'empty_request_body',
                        'password_is_missing',
                        'confirm_password_is_missing',
                        'current_password_is_missing',
                        'current_password_can_not_be_empty',
                        'password_should_equal_confirm_password',
                        'new_password_should_not_equal_current_password'
                        ]
                  example:
                        message: 'new_password_should_not_equal_current_password'
  
   #SendSecretTokenResetPassword
    SendSecretTokenResetPasswordRequestBody:
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: "developer@turboSMTP.com"
          description: turboSMTP account email address.
      required:
        - email
      example: 
        email: "developer@turboSMTP.com"
        
    SendSecretTokenResetPasswordBadRequestResponseBody:
                    additionalProperties: false
                    properties:
                      message:
                        type: string
                    example:
                          message: 'empty_request_body'    

   #CheckValidityTokenResetPassword                      
    CheckValidityTokenResetPasswordBadRequestResponseBody:
                    additionalProperties: false
                    properties:
                      message:
                        type: string
                        enum: [ 
                          'forgot_password_token_is_missing'
                          ]
                    example:
                          message: 'forgot_password_token_is_missing'                           

   #UpdateResetPassword      
    UpdateResetPasswordRequestBody:
      additionalProperties: false
      properties:
        password:
          type: string
          description: New Password to be used.
        confirm_password:
          type: string
          description: New Password to be used.
        token:
          type: string
          description: Reset Password Token
      required:
          - password
          - confirm_password
          - token
      example:
        password: "SMBBBf4J686P"
        confirm_password: "SMBBBf4J686P"
        token: "781d4b44aaf5de86dc0a7e1ca2dc409f"        
        
    UpdateResetPasswordBadRequestResponseBody:
                  additionalProperties: false
                  properties:
                    message:
                      type: string
                      enum: [ 
                        'empty_request_body',
                        'password_is_missing',
                        'confirm_password_is_missing',
                        'current_password_is_missing',
                        'current_password_can_not_be_empty',
                        'password_should_equal_confirm_password',
                        'new_password_should_not_equal_current_password'
                        ]
                  example:
                        message: 'new_password_should_not_equal_current_password'     
  
  ####################
  # Common parameters
  ####################
  #parameters:

  #######################
  # Common request bodies
  #######################
  #requestBodies:


  ####################
  # Common responses
  ####################

  #########################
  # Common headers
  # (except request headers - they are defined as parameters)
  #########################
  #headers:

  ######################################
  # Common examples of input/output data
  ######################################
  #examples:

  #########################
  # Common link definitions
  # See: https://swagger.io/docs/specification/links/
  #########################
  #links: {}

  #########################
  # Common callback definitions
  # See: https://swagger.io/docs/specification/callbacks/
  #########################
  #callbacks: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    consumerKey:
      type: apiKey
      in: header
      name: consumerKey
    consumerSecret:
      type: apiKey
      in: header
      name: consumerSecret
servers:   
  - description: turboSMTP Production Server
    url: https://pro.api.serversmtp.com/api/v2
