# OpenAPI version identifier - required for OpenAPI 3.0 domains
openapi: 3.1.0

#######################
# Optional info sectionf
#######################
info:
  title: Email Validation Components
  description: Email Validation components for TurboSMTP REST APIs
  version: '1.0.0-oas3'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:   
- description: turboSMTP Production Server
  url: https://pro.api.serversmtp.com/api/v2

components:

  #######################
  # Common path items
  #######################
  pathItems:
    Subscription:
      get:
        operationId: getEmailValidationSubscription      
        tags: 
          - email-validator
        summary: Get Email Validation subscription
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           This endpoint allows to get details about remaining credit / balance for email validation.
        responses:
          '200':
            description: | 
              Sucess
              
              Email Validation Subscription.
              
              #### Note: ####
              
              * Free credits are measured in credits units, each credit enables 1 email validation.
              
              * Paid credits represent available monetary balance, as email vaidations are performed, balance will be deduced, cost per email validation is variable depending on ammount of validated emails.
              
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorSubscription'
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'

    Lists:
      get:
        operationId: getEmailValidationLists
        tags:
          - email-validator
        summary: Get Email validation lists information
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           List files for email validation information
        
        parameters:
          - $ref: './Shared.yaml#/components/parameters/PageQueryParam'
          - $ref: './Shared.yaml#/components/parameters/LimitQueryParam'  
          - $ref: './Shared.yaml#/components/parameters/FromQueryParam'
          - $ref: './Shared.yaml#/components/parameters/ToQueryParam'
          - $ref: './Shared.yaml#/components/parameters/TimezoneQueryParam'
  
        responses:
          '200':
            description: | 
              Sucess
              
              Get Email Validation Lists Data.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorSucessResponsetBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'       

    ValidateEmails:
      post:
        operationId: validateEmailValidatorList
        tags:
          - email-validator
        summary: |
          Validate list in Email Validator
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
          Validate list in Email Validator
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'
        responses:
          '200':
            description: | 
              Sucess
              
              List was validated sucessfully.
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * list_already_validated
              * insufficient_credit
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorValidateListBadRequestResponseBody'
          '404':
                description: |
                  Not Found
                  
                  Please verify the list id is valid.
                content:
                  application/json:
                    schema:
                      $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                    example: 
                      message: "list_not_found" 
          
    ValidatedEmails:
      get:
        operationId: getValidatedEmailsByList
        tags:
          - email-validator
        summary: Get Validated Emails by Email Validation List
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Get Validated Emails by Email Validation List
  
        parameters:
          - $ref: './Shared.yaml#/components/parameters/PageQueryParam'
          - $ref: './Shared.yaml#/components/parameters/LimitQueryParam'  
          - $ref: './Shared.yaml#/components/parameters/IdParam'
  
        responses:
          '200':
            description: | 
              Sucess
              
              Get Email Validation List Data.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorValidatedMailsResults'
                examples:
                      ValidatedList:
                        summary: Example for a list that has been validated
                        value:
                          count: 2
                          processed: 2
                          results: [
                              {
                                "email": "mail@thearter-gallery.eu",
                                "id": 500157,
                                "status": "do_not_mail",
                                "sub_status": "",
                                "free_email": false,
                                "domain": "thearter-gallery.eu",
                                "domain_age_days": null,
                                "smtp_provider": null,
                                "mx_found": true,
                                "mx_record": "gmail-smtp-in.l.google.com"
                              },
                              {
                                "email": "staffdevelopment@guidingteachers.org",
                                "id": 500158,
                                "status": "valid",
                                "sub_status": "",
                                "free_email": false,
                                "domain": "guidingteachers.org",
                                "domain_age_days": null,
                                "smtp_provider": null,
                                "mx_found": true,
                                "mx_record": "gmail-smtp-in.l.google.com"
                              }                              
                            ]
                      NotValidatedList:
                        summary: Example for a list that has not been validated yet
                        value:
                          count: 2
                          processed: 0
                          results: []
                  
          
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized' 
          '404':
              description: |
                Not Found
                
                Please verify the list id is valid.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "list_not_found"    
    
    CSV:
      get:
        operationId: exportCSVValidatedEmailsByList
        tags:
          - email-validator   
        summary: Export Validated Emails by Email Validation List to CSV File
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Export Validated Emails by Email Validation List to CSV File
        
        parameters:    
          - $ref: './Shared.yaml#/components/parameters/IdParam'
                
        responses:
          '200':
            $ref: '#/components/responses/ValidatedEmailsCSV'        
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '404':
              description: |
                Not Found
                
                Please verify the list id is valid.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "list_not_found" 

    List:
      get:
        operationId: getEmailValidationListSummary
        tags:
          - email-validator
        summary: Get Email validation list details
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Get Email validation list details
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'
      
        responses:
          '200':
            description: | 
              Sucess
              
              Get Email Validation List Data.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorList'

          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'  
          '404':
              description: |
                Not Found
                
                Please verify the list id is valid.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "list_not_found"                    

      delete:
        operationId: deleteEmailValidationListById
        tags:
          - email-validator
        summary: Delete email validation list
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Delete email validation list
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'
        responses:
          '200':
            description: | 
              Sucess
              
              Email validation list was deleted.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorListDeleteSuccess' 
          '404':
              description: |
                Not Found
                
                Please verify the list id is valid.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "list_not_found"                    
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'             
          
    Upload:        
      post:
        operationId: uploadEmailValidationFile      
        tags: 
          - email-validator
        summary: Upload file for email validation
        security:
          - ApiKeyAuth: [ ]  
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Upload file for email validation
           
        
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                required: [file]
                properties:
                  file:
                    type: string
                    format: binary
                    description: |
                      CSV or TXT file containing email addresses (one per line).
                      Supported formats: text/csv (CSV), text/plain (TXT).
                      The file may contain invalid email addresses; these will be
                      processed and flagged as invalid in the validation results.
        responses:
          '201':
            description: |
              Sucess

              Uploaded file was created at the server.

            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidationUploadResponse'
            links:
              GetListById:
                operationId: getEmailValidationListSummary
                parameters:
                  Id: '$response.body#/list_id'
              ValidateListById:
                operationId: validateEmailValidatorList
                parameters:
                  Id: '$response.body#/list_id'
              DeleteListById:
                operationId: deleteEmailValidationListById
                parameters:
                  Id: '$response.body#/list_id'
          '400':
            description: |
              Bad Request
              
              ###### Produces:

              * missing_upload_file
              * invalid_mail_address_list
              * unsupported_file_format
              
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorUploadBadRequestResponseBody'                   
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized' 

    Email:
      post:
        operationId: validateEmail
        tags:
          - email-validator
        summary: Validate single email address
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
           Validate singleemail adddress.
        requestBody:
          required: true
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailAddressRequestBody'
        responses:
          '200':
            description: | 
              Sucess
              
              Details of validated email address. 
              
              **Note**: Make sure to check the complete "status" and "sub_status" properties documentation from the schema.
              
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorMailDetails'
                  
          '400':
            description: |
              Bad Request

              ###### Produces:

              * invalid_email_address
              * missing_required_parameter_email

            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EmailValidatorValidateBadRequestResponseBody'                  
                  
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized' 
      
    EmailDataByID:
      get:
        operationId: getEmailValidationDataByEmailId
        tags:
          - email-validator
        summary: Get Email validation data by email ID.
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        description: |
           
            Get Email validation data by email ID.
        
        parameters:
            - $ref: './Shared.yaml#/components/parameters/IdParam'
            - name: emailId
              in: path
              required: true
              schema:
                type: integer
              description: Email validation ID obtained from the list.
            
        responses:
            '200':
              description: | 
                Sucess
                
                Details of validated email address. 
                
                **Note**: Make sure to check the complete "status" and "sub_status" properties documentation from the schema.
                
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/EmailValidatorListEmailDetails'        
            '401':
                $ref: './Shared.yaml#/components/responses/Unauthorized'
            '404':
                  description: |
                    Not Found
                    
                    Please verify the list id and email id are valid.
                  content:
                    application/json:
                      schema:
                        $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                      examples:
                        InvalidListId:
                          summary: Invalid List Id
                          value:
                            message: "list_not_found"
                        InvalidEmailId:
                          summary: Invalid Email Id
                          value:
                            message: "email_not_found"                                 

  ####################
  # Common data models
  ####################
  schemas:
  
    EmailValidatorValidatedMailsResults:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          description: Count of vaidated email addresses in the list.
        processed:
          type: integer
          description: Number of processed email addresses in the list.
        results:
          type: array
          description: Array of validated email addresses in the list.
          items:
            $ref: '#/components/schemas/EmailValidatorMailDetailsBasic'


    EmailValidatorMailSharedDetails:
      type: object
      properties:
              status:
                    type: string
                    enum: ['valid', 'invalid', 'catch_all', 'unknown', 'spamtrap', 'abuse', 'do_not_mail']
                    example: 
                        'valid'
                    description: |
                    
                      The status of the email address you are validating.
                      
                        DELIVERABILITY STATUS EXPLANATION
      
                        valid:
                        These are emails that were determined to be valid and safe to email to, they will have a very low bounce rate of under 2%. If you receive bounces it can be because your IP might be blacklisted where our IP was not. Sometimes the email accounts exist, but they are only accepting mail from people in their contact lists. Sometimes you will get throttle on number of emails you can send to a specific domain per hour. It's important to look at the SMTP Bounce codes to determine why.
                        
                        invalid:
                        These are emails that were determined to be invalid, please delete them from your mailing list.
                        
                        catch-all: 
                        These emails are impossible to validate without sending a real email and waiting for a bounce. The term Catch-all means that the email server tells you that the email is valid, whether it's valid or invalid. If you want to email these addresses, we suggest you segment them into a catch-all group and be aware that some of these will most likely bounce.
                        
                        spamtrap: 
                        These emails are believed to be spamtraps and should not be mailed. We have technology in place to determine if certain emails should be classified as spamtrap. We don't know all the spamtrap email addresses, but we do know a lot of them.
                        
                        abuse: 
                        These emails belong to people who are known to click the abuse links in emails, hence abusers or complainers. We recommend not emailing these addresses.
                        
                        do_not_mail: 
                        These emails belong to companies, role-based, or people you just want to avoid emailing to. They are broken down into 6 sub-categories "disposable","toxic", "role_based", "role_based_catch_all", "global_suppression" and "possible_trap". You should decide if you want to email these address. They are valid email addresses, but shouldn't be mailed in most cases.
                        
                        unknown: 
                        These emails we weren't able to validate for one reason or another. Typical cases are "Their mail server was down" or "the anti-spam system is blocking us". In most cases, 80% unknowns are invalid/bad email addresses.
              sub_status:
                    type: string
                    enum: ['','antispam_system', 'greylisted', 'mail_server_temporary_error', 'forcible_disconnect', 'mail_server_did_not_respond', 'timeout_exceeded', 'failed_smtp_connection', 'mailbox_quota_exceeded', 'exception_occurred', 'possible_trap', 'role_based', 'global_suppression', 'mailbox_not_found', 'no_dns_entries', 'failed_syntax_check', 'possible_typo', 'unroutable_ip_address', 'leading_period_removed', 'does_not_accept_mail', 'alias_address', 'role_based_catch_all', 'disposable', 'toxic']
                    example: ''
                    description: |
                      The sub-status of the email address you are validating.
                      
                      alias_address: 
                      (valid) These emails addresses act as forwarders/aliases and are not real inboxes, for example if you send an email to forward@example.com and then the email is forwarded to realinbox@example.com. It's a valid email address and you can send to them, it's just a little more information about the email address. We can sometimes detect alias email addresses and when we do we let you know.
                      
                      antispam_system: 
                      (unknown) These emails have anti-spam systems deployed that are preventing us from validating these emails.
                      
                      does_not_accept_mail: 
                      (invalid) These domains only send mail and don't accept incoming mail.
                      
                      exception_occurred: 
                      (unknown) These emails caused an exception when validating.
                      
                      failed_smtp_connection: 
                      (unknown) These emails belong to a mail server that won't allow an SMTP connection. Most of the time, these emails will end up being invalid.
                      
                      failed_syntax_check: 
                      (Invalid) Emails that fail RFC syntax protocols
                      
                      forcible_disconnect: 
                      (Unknown) These emails belong to a mail server that disconnects immediately upon connecting. Most of the time, these emails will end up being invalid.
                      global_suppression: 
                      (do_not_mail) These emails are found in many popular global suppression lists (GSL), they consist of known ISP complainers, direct complainers, purchased addresses, domains that don't send mail, and known litigators.
                      
                      greylisted: 
                      (Unknown) Emails where we are temporarily unable to validate them. A lot of times if you resubmit these emails they will validate on a second pass.
                      
                      leading_period_removed: 
                      (valid) If a valid gmail.com email address starts with a period '.' we will remove it, so the email address is compatible with all mailing systems.
                      
                      mail_server_did_not_respond- 
                      (unknown) These emails belong to a mail server that is not responding to mail commands. Most of the time, these emails will end up being invalid.
                      
                      mail_server_temporary_error: 
                      (unknown) These emails belong to a mail server that is returning a temporary error. Most of the time, these emails will end up being invalid.
                      mailbox_quota_exceeded: 
                      (invalid) These emails exceeded their space quota and are not accepting emails. These emails are marked invalid.
                      
                      mailbox_not_found: 
                      (invalid) These emails addresses are valid in syntax, but do not exist. These emails are marked invalid.
                      
                      no_dns_entries: 
                      (invalid) These emails are valid in syntax, but the domain doesn't have any records in DNS or have incomplete DNS Records. Therefore, mail programs will be unable to or have difficulty sending to them. These emails are marked invalid.
                      
                      possible_trap: 
                      (do_not_mail) These emails contain keywords that might correlate to possible spam traps like spam@ or @spamtrap.com. Examine these before deciding to send emails to them or not.
                      
                      possible_typo: 
                      (invalid) These are emails of commonly misspelled popular domains. These emails are marked invalid.
                      
                      role_based: 
                      (do_not_mail) These emails belong to a position or a group of people, like sales@ info@ and contact@. Role-based emails have a strong correlation to people reporting mails sent to them as spam and abuse.
                      
                      role_based_catch_all: 
                      (do_not_mail) These emails are role-based and also belong to a catch_all domain.
                      
                      timeout_exceeded: 
                      (unknown) These emails belong to a mail server that is responding extremely slow. Most of the time, these emails will end up being invalid.
                      
                      unroutable_ip_address: (invalid) These emails domains point to an un-routable IP address, these are marked invalid.
                      
                      disposable: 
                      (do_not_mail) These are temporary emails created for the sole purpose to sign up to websites without giving their real email address. These emails are short lived from 15 minutes to around 6 months. There is only 2 values (True and False). If you have valid emails with this flag set to TRUE, you shouldn't email them.
                      
                      toxic: 
                      (do_not_mail) These email addresses are known to be abuse, spam, or bot created emails. If you have valid emails with this flag set to TRUE, you shouldn't email them.
              free_email:
                    type: boolean
                    example: true
                    description: True if the email address comes from a free email service provider.
              domain:
                    type: string
                    example: gmail.com
                    description: The portion of the email address after the "@" symbol.
              domain_age_days:
                    type: [integer, "null"]
                    example: 9964
                    description: Age of the email domain in days or [null].
              smtp_provider:
                    type: [string, "null"]
                    example: 'google'
                    description: The SMTP Provider of the email or [null].
              mx_found:
                    type: boolean
                    example: true
                    description: True if the domain have an MX record.
              mx_record:
                    type: [string, "null"]
                    example: 'gmail-smtp-in.l.google.com'
                    description: The preferred MX record of the domain or [null].

    EmailValidatorListEmailDetails:
      unevaluatedProperties: false
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - type: object
          properties:
            email:
              type: string
              example: "username@gmail.com"
              description: Email address. May contain invalid formats (e.g., '@') when validation fails, to show what was submitted.
            account_id:
              type: integer
              example: 20823223
              description: Email validator account id.
            created_at:
              $ref: './Shared.yaml#/components/schemas/CustomDateTimeFormat'
              example: 2021-03-17 00:00:00
              description: The date time the email was inserted into turboSMTP database after being validated.
            did_you_mean:
              type: string
              example: the-user@gmail.com
              description: Suggestive Fix for an email typo
            id:
              type: integer
              example: 18535681
              description: Email Id.
            list_id:
              type: integer
              example: 10629
              description: List Id.
        - $ref: '#/components/schemas/EmailValidatorMailSharedDetails'              
            
              
  
    EmailValidatorMailDetailsBasic:
      unevaluatedProperties: false
      type: object
      properties:
        email:
          type: string
          description: |
            Email address as submitted. May contain invalid formats
            (e.g., '@') for failed validations. Check 'status' field
            to determine if address is valid.
          example: "username@gmail.com"
        id:
          type: integer
          example: 2047
          description: The id of the email address
      required:
        - email
        - id
      allOf:
        - $ref: '#/components/schemas/EmailValidatorMailSharedDetails'
                    
    EmailValidatorMailDetails:
      unevaluatedProperties: false
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - $ref: '#/components/schemas/EmailValidatorMailSharedDetails'
        -  type: object
           properties:
              email:
                type: string
                example: "username@gmail.com"
                description: Email address. May contain invalid formats (e.g., '@') when validation fails, to show what was submitted.
              did_you_mean:
                    type: [string, "null"]
                    example: the-user@gmail.com
                    description: Suggestive Fix for an email typo or [null].
              account:
                    type: string
                    example: username
                    description: The portion of the email address before the "@" symbol.
              firstname:
                    type: [string, "null"]
                    example: 'Jhon'
                    description: The first name of the owner of the email when available or [null].
              lastname:
                    type: [string, "null"]
                    example: 'Doe'
                    description: The last name of the owner of the email when available or [null].
              gender:
                    type: [string, "null"]
                    example: 'female'
                    description: The gender of the owner of the email when available or [null].
              country:
                    type: [string, "null"]
                    example: null
                    description: The country of the IP passed in or [null]
              region:
                    type: [string, "null"]
                    example: null
                    description: The region/state of the IP passed in or [null]
              city:
                    type: [string, "null"]
                    example: null
                    description: The city of the IP passed in or [null]
              zipcode:
                    type: [integer, "null"]
                    example: null
                    description: The zipcode of the IP passed in or [null]
              processed_at:
                    $ref: './Shared.yaml#/components/schemas/CustomDateTimeFormat'
                    example: 2021-03-17 00:00:00
                    description: The date time the email was validated.
              
    EmailValidatorSubscription:
      type: object
      additionalProperties: false
      required:
        - currency
        - free_credits
        - free_credits_used
        - last_used_period
        - latest_period_start_date
        - paid_credits
        - period_expiration_date
        - remaining_free_credit
      properties:
        currency:
          $ref: './Shared.yaml#/components/schemas/Currency'
        free_credits:
          type: integer
          format: int32
          minimum: 0
          example: 3000
          description: Ammount of allocated free credits.
        free_credits_used:
          type: integer
          format: int32
          minimum: 0
          example: 200
          description: Ammount of used free credits.
        last_used_period:
          $ref: './Shared.yaml#/components/schemas/NullableCustomDateTimeFormat'
          example: '2022-11-20 00:00:00'
          description: Last time credit was used.
        latest_period_start_date:
          $ref: './Shared.yaml#/components/schemas/NullableCustomDateTimeFormat'
          example: '2022-11-09 00:00:00'
          description: Free credit period start date (renewed each cycle).
        period_expiration_date:
          $ref: './Shared.yaml#/components/schemas/NullableCustomDateTimeFormat'
          example: '2022-12-09 00:00:00'
          description: Free credit period expiration date.
        paid_credits:
          type: number
          format: currency
          example: 437.4560
          minimum: 0
          description: Amount of remaining money specified in the 'currency' field value currency. 
        remaining_free_credit:
          type: integer
          format: int32
          minimum: 0
          example: 2800
          description: Ammount of remaining free credits. 
  
    EmailValidationUploadResponse:
      type: object
      additionalProperties: false
      properties:
        list_id:
          type: integer
          description: List Identifier
          example: 10093
        total_emails:
          type: integer
          description: Total emails found in uploaded file
          example: 314
          
    EmailValidatorStatusSummaryItem:
      type: object
      additionalProperties: false
      properties:
              status:
                    type: string
                    enum: ['valid', 'invalid', 'catch_all', 'unknown', 'spamtrap', 'abuse', 'do_not_mail']
                    example: 
                        'valid'
                    description: |
                    
                      The status of the email address you are validating.
                      
                        DELIVERABILITY STATUS EXPLANATION
      
                        valid:
                        These are emails that were determined to be valid and safe to email to, they will have a very low bounce rate of under 2%. If you receive bounces it can be because your IP might be blacklisted where our IP was not. Sometimes the email accounts exist, but they are only accepting mail from people in their contact lists. Sometimes you will get throttle on number of emails you can send to a specific domain per hour. It's important to look at the SMTP Bounce codes to determine why.
                        
                        invalid:
                        These are emails that were determined to be invalid, please delete them from your mailing list.
                        
                        catch-all: 
                        These emails are impossible to validate without sending a real email and waiting for a bounce. The term Catch-all means that the email server tells you that the email is valid, whether it's valid or invalid. If you want to email these addresses, we suggest you segment them into a catch-all group and be aware that some of these will most likely bounce.
                        
                        spamtrap: 
                        These emails are believed to be spamtraps and should not be mailed. We have technology in place to determine if certain emails should be classified as spamtrap. We don't know all the spamtrap email addresses, but we do know a lot of them.
                        
                        abuse: 
                        These emails belong to people who are known to click the abuse links in emails, hence abusers or complainers. We recommend not emailing these addresses.
                        
                        do_not_mail: 
                        These emails belong to companies, role-based, or people you just want to avoid emailing to. They are broken down into 6 sub-categories "disposable","toxic", "role_based", "role_based_catch_all", "global_suppression" and "possible_trap". You should decide if you want to email these address. They are valid email addresses, but shouldn't be mailed in most cases.
                        
                        unknown: 
                        These emails we weren't able to validate for one reason or another. Typical cases are "Their mail server was down" or "the anti-spam system is blocking us". In most cases, 80% unknowns are invalid/bad email addresses.
              total:
                type: integer
                description: Ammount of emails in the status within the list.
                example: 12

    EmailValidatorList:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Email validation list id.
          example: 2406
        creation_time:
          $ref: './Shared.yaml#/components/schemas/CustomDateTimeFormat'
          description: Date and Time of the validation list creation.
          example: '2021-03-17 08:56:00'
        file_name:
          type: string
          description: File name of the uploaded file.
          example: BusinessProspects.txt
        is_processed:
          type: boolean
          description: True if the validation list was already processed.
          example: true
        percentage:
          type: integer
          description: Describes the percentage progress of validation list.
          example: 83
        total_emails:
          type: integer
          description: Amount of email addresses in the validation list.
          example: 314
        total_processed:
          type: integer
          description: Describes the count of email addresses processed so far.
          example: 28
        status_summary:
          type: array
          items: 
            $ref: '#/components/schemas/EmailValidatorStatusSummaryItem'
          example:
            - status: valid
              total: 2
            - status: invalid
              total: 5
          
    EmailValidatorSucessResponsetBody:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmailValidatorList'
      example:
                    count: 2
                    results:
                      - id: 2406
                        creation_time: 2021-03-17 00:00:00
                        file_name: BusinessProspects.txt
                        is_processed: true
                        percentage: 100
                        total_emails: 158
                        total_processed: 158      
                      - id: 2407
                        creation_time: 2021-03-21 00:00:00
                        file_name: OldContacts.txt
                        is_processed: false
                        percentage: 0
                        total_emails: 158
                        total_processed: 0                           
                        
    EmailValidatorListDeleteSuccess:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
      example:
        success: true 
    
    EmailValidatorUploadBadRequestResponseBody:
                additionalProperties: false
                properties:
                  message:
                    type: string
                example:
                    message: "missing_upload_file"
                    
    EmailValidatorValidateListBadRequestResponseBody:
                additionalProperties: false
                properties:
                  message:
                    type: string
                    enum: ['list_already_validated','insufficient_credit']
                example: 
                    message: 'list_already_validated'
    
    EmailValidatorValidateBadRequestResponseBody:
                  additionalProperties: false
                  properties:
                    message:
                      type: string
                      enum: [
                        'invalid_email_address',
                        'missing_required_parameter_email'
                        ]
                  example:
                        message: 'invalid_email_address'
                        
    EmailAddressRequestBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: email address to validate
          format: email
          example: developer@yourcompany.com                        
    
