# OpenAPI version identifier - required for OpenAPI 3.1 domains
openapi: 3.1.0

#######################
# Optional info section
#######################
info:
  title: Meta Components
  description: Meta components for TurboSMTP REST APIs
  version: '1.0.0-oas3'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

# Empty paths section - required for OpenAPI 3.0 structure
paths: {}

components:

  #######################
  # Common path items
  #######################
  pathItems:
    Countries:
      get:
        tags:
          - meta
        summary: Get countries
        security: []
        operationId: getCountries
        description: |
          Get countries (public endpoint, no authentication required)
        responses:
          '200':
            description: Countries list
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CountryList'
    
    States:
      get:
        tags:
          - meta
        summary: Get states by country
        security: []
        operationId: getStatesByCountry
        description: |
          Get states by country (public endpoint, no authentication required)
        parameters:
          - $ref: '#/components/parameters/IsoCodePathParam'
        responses:
          '200':
            description: States selected
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StateList'
          '404':
              description: |
                Not Found
                
                Please verify the Country Iso Code Provided.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "invalid_iso_code" 
    
    Alerts:
      get:
        operationId: getAlerts
        tags:
          - alerts
        summary: Get Alerts Notifications Information
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           List Alerts Notifications Information
           
        responses:
          '200':
            description: | 
              Sucess
              
              Alerts list.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AlertListSucessResponsetBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

      post:
        operationId: createAlert
        tags:
          - alerts
        summary: Create new Alert Notification
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Create new Alert Notification

        requestBody:
          required: true
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AlertBase'
                example:
                  email: "alert@example.com"
                  percentage: 80

        responses:
          '201':
            description: |
              Sucess

              Alert Notification Created Sucessfully.

            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Alert'
            links:
              GetAlertById:
                operationId: getAlert
                parameters:
                  Id: '$response.body#/id'
              UpdateAlertById:
                operationId: updateAlert
                parameters:
                  Id: '$response.body#/id'
              DeleteAlertById:
                operationId: deleteAlert
                parameters:
                  Id: '$response.body#/id'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * missing_required_parameter_email
              * missing_required_parameter_percentage
              * percentage_should_be_integer
              * percentage_should_not_be_less_than_0
              * percentage_should_not_be_higher_than_100
              
              
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'                  
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'
    
    AlertsID:
      patch:
        operationId: updateAlert
        tags:
          - alerts
        summary: Update Alert Notification
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Update Alert Notification.
           
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'  
          
        requestBody:
          required: true
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AlertBase'
                example:
                  email: "alert@example.com"
                  percentage: 80

        responses:
          '200':
            description: | 
              Sucess
              
              Alert updated sucessfully.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Alert'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * percentage_should_be_integer
              * percentage_should_not_be_less_than_0
              * percentage_should_not_be_higher_than_100
              
              
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'                    
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '404':
            description: |
              Not Found
  
              Please verify the alert id exists.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example:
                  message: alert_not_found  
      get:
        operationId: getAlert
        tags:
          - alerts
        summary: Get Alert Notification
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Get Alert Notification.
           
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'  
          
        responses:
          '200':
            description: | 
              Sucess
              
              Alert Notification.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Alert'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '404':
            description: |
              Not Found
  
              Please verify the alert id exists.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example:
                  message: alert_not_found  

      delete:
        operationId: deleteAlert
        tags:
          - alerts
        summary: Delete Alert Notification
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Delete an Alert Notification.
           
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'           
        responses:
          '200':
            description: | 
              Sucess
              
              Alert was deleted.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '404':
            description: |
              Not Found
  
              Please verify the alert id exists.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example:
                  message: alert_not_found            

    Analytics:
      get:
        tags:
          - analytics
        summary: Get Analytics Data
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        operationId: getAnalyticsData
        description: |
          Get Analytics Data
        parameters:
          - $ref: './Shared.yaml#/components/parameters/PageQueryParam'
          - $ref: './Shared.yaml#/components/parameters/LimitQueryParam'
          - $ref: './Shared.yaml#/components/parameters/FromQueryParam'
          - $ref: './Shared.yaml#/components/parameters/ToQueryParam'
          - $ref: '#/components/parameters/AnalyticStatusQueryParam'
          - $ref: '#/components/parameters/AnalyticFilterByQueryParam'
          - $ref: '#/components/parameters/AnalyticFilterQueryParam'        
          - $ref: './Shared.yaml#/components/parameters/SmartSearchQueryParam'
          - $ref: '#/components/parameters/AnalyticOrderByQueryParam'
          - $ref: './Shared.yaml#/components/parameters/OrderTypeQueryParam'          
          - $ref: './Shared.yaml#/components/parameters/TimezoneQueryParam'
        responses:
          '200':
            description: | 
              Sucess
              
              Get Analytics Data.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AnalyticsListSucessResponsetBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * page_should_be_integer
              * page_should_be_greater_than_0
              * limit_should_be_integer
              * limit_should_be_greater_than_0
              * missing_required_parameter_from
              * from_format_should_be_yyyy-mm-dd
              * missing_required_parameter_to
              * to_format_should_be_yyyy-mm-dd
              * missing_required_parameter_filter_by
              * invalid_status_value
              * filter_by_can_only_be_subject_or_sender_or_recipient_or_domain
              * smart_search_should_be_true_or_false
              * orderby_can_only_be_subject_or_sender_or_recipient_or_domain
              * ordertype_should_be_asc_or_desc                  
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

    AnalyticsCSV:
      get:
        tags:
          - analytics
        summary: Export Analytics data in CSV file
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]              
        operationId: exportAnalyticsDataCSV
        description: |
          Export Analytics data in CSV file
        parameters:
          - $ref: './Shared.yaml#/components/parameters/FromQueryParam'
          - $ref: './Shared.yaml#/components/parameters/ToQueryParam'
          - $ref: '#/components/parameters/AnalyticStatusQueryParam'
          - $ref: '#/components/parameters/AnalyticFilterByQueryParam'
          - $ref: '#/components/parameters/AnalyticFilterQueryParam'        
          - $ref: './Shared.yaml#/components/parameters/SmartSearchQueryParam'
          - $ref: '#/components/parameters/AnalyticOrderByQueryParam'
          - $ref: './Shared.yaml#/components/parameters/OrderTypeQueryParam'          
          - $ref: './Shared.yaml#/components/parameters/TimezoneQueryParam'

        responses:
          '200':
            description: Analytics CSV data
            content:
              text/csv:
                schema:
                  type: string
                  example: |
                    1871534200146968576,DEFER,"Fwd: Test",test@emailchef.com,test@live.com,"Wednesday, February 21 2024 7:48 AM"," Connected to 104.47.51.161 but connection died. (#4.4.2)
                    1871533807186821120,DEFER,"Test send",test@emailchef.com,test@live.com,"Wednesday, February 21 2024 7:47 AM"," Connected to 104.47.55.161 but connection died. (#4.4.2)
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * missing_required_parameter_from
              * from_format_should_be_yyyy-mm-dd
              * missing_required_parameter_to
              * to_format_should_be_yyyy-mm-dd
              * missing_required_parameter_filter_by
              * invalid_status_value
              * filter_by_can_only_be_subject_or_sender_or_recipient_or_domain
              * smart_search_should_be_true_or_false
              * orderby_can_only_be_subject_or_sender_or_recipient_or_domain
              * ordertype_should_be_asc_or_desc                  
  
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
    
    AnalyticsById:
      get:
        tags:
          - analytics
        summary: Get Analytics Single Item by ID
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]  
        operationId: getAnalyticsDataByID
        description: |
          Get Analytics Data by ID
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'
        responses:
          '200':
            description: | 
              Sucess
              
              Response body contains the Analytic Item requested by ID.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AnalyticMailItem'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * XXXXXXX
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '404':
              description: |
                Not Found
                
                The Analytic ID was not found
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example:
                    message: "email_not_found"
                  
  ####################
  # Common data models
  ####################
  
  schemas:
  
    Country:
      type: object
      additionalProperties: false
      properties:
        iso_code:
          type: string
          example: "US"
        currency:
          type: string
          example: "USD"
        flag:
          type: string
          example: "🇺🇸"
        name:
          type: string
          example: "United States"
        phonecode:
          type: string
          example: "1"
  
    CountryList:
       type: array
       items:
          $ref: '#/components/schemas/Country'
       example: [
                  {
                    "iso_code": "AF",
                    "currency": "AFN",
                    "flag": "🇦🇫",
                    "name": "Afghanistan",
                    "phonecode": "93"
                  },
                  {
                    "iso_code": "AX",
                    "currency": "EUR",
                    "flag": "🇦🇽",
                    "name": "Aland Islands",
                    "phonecode": "+358-18"
                  },
                  {
                    "iso_code": "AL",
                    "currency": "ALL",
                    "flag": "🇦🇱",
                    "name": "Albania",
                    "phonecode": "355"
                  }
                ]
    
    State:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          example: "Alabama"
        iso_code:
          type: string
          example: "AL"
        country_code:
          type: string
          example: "US"
        type:
          type: [integer, "null"]
          example: null
          
    StateList:
      type: array
      items:
        $ref: '#/components/schemas/State'
      example: [
                  {
                    "name": "Alabama",
                    "iso_code": "AL",
                    "country_code": "US",
                    "type": null
                  },
                  {
                    "name": "Alaska",
                    "iso_code": "AK",
                    "country_code": "US",
                    "type": null
                  },
                  {
                    "name": "American Samoa",
                    "iso_code": "AS",
                    "country_code": "US",
                    "type": null
                  }        
              ]
              
    AlertBase:
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - type: object
          properties:
              percentage:
                  type: integer
                  example: 80
                  description: "Percentage of usage that will trigger the alert"
                  maximum: 100
                  minimum: 0

    Alert:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AlertBase'
        - type: object
          properties:
              id:
                  type: integer
                  example: 4117
                  description: Alert Id.
    
    AlertListSucessResponsetBody:
      type: object
      additionalProperties: false
      properties:
          count:
            type: integer
          results:
            type: array
            items:
              $ref: '#/components/schemas/Alert'
      example:
                      count: 2
                      results:
                        - id: 4117
                          email: doe-jhon@yourdomain.om
                          percentage: 50
                        - id: 4118
                          email: doe-jhon@yourdomain.om
                          percentage: 100       


    AnalyticMailStatus:
      description: |
        Send Mail Status:
        
        NEW: email has been queued for delivery
        DEFER: email is in the queue for delivery
        SUCCESS: email has been delivered.
        OPEN: email has been opened.
        CLICK: email has been clicked.
        REPORT: email has been reported as spam.
        FAIL: email has bounced.
        SYSFAIL: email was dropped.
        UNSUB: email is unsubscribed.
        
        Notice that emails that fall into the above statuses can be grouped, ie Turbo-Smtp uses the following groups:
        
          'Clicks' = 'CLICK',
          'Unsubscribes' = 'UNSUB',
          'Spam' = 'REPORT',
          'Drop' = 'SYSFAIL',
          'Queued' = 'NEW' or 'DEFER',
          'Opens'= 'OPEN' or 'CLICK' or 'UNSUB' or 'REPORT',
          'Delivered'= 'SUCCESS'  or 'OPEN' or 'CLICK' or 'UNSUB' or 'REPORT',
          'Bounce': 'FAIL'.
      type: string
      enum: [ 'NEW', 'DEFER' , 'SUCCESS' , 'OPEN' , 'CLICK' , 'REPORT' , 'FAIL' , 'SYSFAIL' , 'UNSUB' ]
    

    AnalyticsListSucessResponsetBody:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticMailItem'
      example: 
        count: 2
        results:
          - id: 1800872493473407000
            subject: Newsletter update
            sender: sample@gmail.com
            recipient: robert-doe@elecronic-arts.com
            send_time: 2023-08-10 04:04:21
            status: SUCCESS
            domain: gmail.com
            error: ""
            recipient_domain: electronic-arts.com
            x_campaign_id: Offer AB Test.
          - id: 1800871904471490600
            subject: New Movies
            sender: sales@gmail.com
            recipient: jhon-doe@datamart.com
            send_time: 2023-08-11 04:04:21
            status: FAIL
            domain: gmail.com
            error: '142.250.138.27 does not like recipient.\nRemote host said: 550-5.1.1 The email account does not exist.'
            recipient_domain: datamart.com
            x_campaign_id: Offer AB Test.

    AnalyticMailItem:
      description: Sent Email
      type: object
      additionalProperties: false
      properties:
          id: 
            type: integer
            format: int64
            example: 1800872493473406976
            description: Email Id.
          subject: 
            type: string
            description: Email Subject.
            example: Business Card.
          sender:
            type: string
            description: Email Sender.
            format: email
            example: user@example.com
          recipient:
            type: string
            description: Email Recipient.
            format: email
            example: user@gmail.com
          send_time:
            type: string
            description: Date Time email was sent.
            pattern: "(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2})"
            example: 2022-11-20 00:00:00
          status: 
            $ref: '#/components/schemas/AnalyticMailStatus'
          domain: 
            type: string
            description: The portion of the sender´s email address after the "@" symbol.
            example: example.com          
          recipient_domain:
            type: string
            description: The portion of the recipient´s email address after the "@" symbol.
            example: gmail.com
          contact_domain:
            type: string
            description: The domain of the contact/recipient.
            example: gmail.com
          x_campaign_id:
            type: string
            description: Value specified in the x_campaign_id custom header to track campaigns specific data.
            example: Offer AB Test.
          error: 
            type: string
            description: Error returned when delivering the email message.
            example: '142.250.138.27 does not like recipient.\nRemote host said: 550-5.1.1 The email account does not exist.'

    AnalyticFilterByOption:
      type: string
      enum: [ 'subject', 'sender', 'recipient', 'domain' ]
      example: 'domain'

    AnalyticFilterBy:
      description: Filter by
      type: array
      items:
        $ref: '#/components/schemas/AnalyticFilterByOption'
      example: ["subject"]
      
    AnalyticOrderBy:
      description: Field to sort by. Valid values are subject, sender, recipient, or send_time.
      type: string
      enum: [ 'subject', 'sender', 'recipient', 'send_time' ]
      default: 'send_time'
      example: 'send_time'    
          
  ####################
  # Common parameters
  ####################
  parameters:
  
    IsoCodePathParam:
          in: path
          name: isoCode
          required: true
          description: Country ISO code (ISO 3166-1 alpha-2 format). Valid values are 2-letter uppercase country codes (e.g., US, GB, DE). Use GET /meta/countries to retrieve all valid codes.
          schema:
              type: string
              pattern: '^[A-Z]{2}$'
              example: US
              
  #Analytics
    AnalyticStatusQueryParam:
      in: query
      required: false
      name: status[]
      style: form
      explode: true
      description: |
          Filter by Status

              NEW: email has been queued for delivery
              DEFER: email is in the queue for delivery
              SUCCESS: email has been delivered.
              OPEN: email has been opened.
              CLICK: email has been clicked.
              REPORT: email has been reported as spam.
              FAIL: email has bounced.
              SYSFAIL: email was dropped.
              UNSUB: email is unsubscribed.

          <br />
          Notice that emails that fall into the above statuses can be grouped, ie Turbo-Smtp uses the following groups:
          <br />

              'Clicks' = 'CLICK',
              'Unsubscribes' = 'UNSUB',
              'Spam' = 'REPORT',
              'Drop' = 'SYSFAIL',
              'Queued' = 'NEW' or 'DEFER',
              'Opens'= 'OPEN' or 'CLICK' or 'UNSUB' or 'REPORT',
              'Delivered'= 'SUCCESS'  or 'OPEN' or 'CLICK' or 'UNSUB' or 'REPORT',
              'Bounce': 'FAIL'.
      schema:
        description: Filter by Status
        type: array
        items:
          $ref: '#/components/schemas/AnalyticMailStatus'
          
    AnalyticFilterQueryParam:
      in: query
      name: filter
      required: false
      schema:
        $ref: './Shared.yaml#/components/schemas/Filter'
      description: Text to search (recipient, sender, email subject or reason for suppression)
      examples:
        bysubject:
          value: 'September 2022'
          summary: Search for email subject.
        bysender:
          value: 'Sales@gmail.com'
          summary: Search for emai sender.
        byrecipient:
          value: 'Jhon.Doe@gmail.com'
          summary: Search for emai recipient.
        bydomain:
          value: 'gmail.com'
          summary: Search for recipient email domain.
        bycampaign:
          value: 'ABC Test'
          summary: Search for Campaign ID.
              
    AnalyticFilterByQueryParam:
      in: query
      name: filter_by
      required: false
      style: form
      explode: true
      description: Filter by
      schema:
        $ref: '#/components/schemas/AnalyticFilterBy'
        
    AnalyticOrderByQueryParam:    
      in: query
      name: orderby
      required: false
      description: Order by
      schema:
        $ref: '#/components/schemas/AnalyticOrderBy'

  ####################
  # Security schemes
  ####################
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
    consumerKey:
      type: apiKey
      in: header
      name: consumerKey
    consumerSecret:
      type: apiKey
      in: header
      name: consumerSecret

servers:   
  - description: turboSMTP Production Server
    url: https://pro.api.serversmtp.com/api/v2
