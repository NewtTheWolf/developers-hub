# OpenAPI version identifier - required for OpenAPI 3.1 domains
openapi: 3.1.0

#######################
# Optional info section
#######################
info:
  title: Subaccounts Components
  description: Common Subaccounts components for TurboSMTP REST APIs
  version: '1.0.0-oas3'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
    
servers:   
- description: turboSMTP Production Server
  url: https://pro.api.serversmtp.com/api/v2

security:
  - ApiKeyAuth: []

# Empty paths section - required for OpenAPI 3.0 structure
paths: {}

components:

  #######################
  # Common path items
  #######################
  
  pathItems:
    List:
      get:
        operationId: getSubaccounts
        tags:
          - subaccounts
        summary: Get Subaccounts lists information
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]            
        description: |
           
           List subaccounts information
           
        parameters:
          - $ref: './Shared.yaml#/components/parameters/PageQueryParam'
          - $ref: './Shared.yaml#/components/parameters/LimitQueryParam'
          - $ref: '#/components/parameters/SubaccountFilterByEmailQueryParam'
          - $ref: '#/components/parameters/SubaccountFilterByActiveQueryParam'
          - $ref: '#/components/parameters/SubaccountFilterByIPQueryParam'
          - $ref: '#/components/parameters/SubaccountOrderByQueryParam'
          - $ref: './Shared.yaml#/components/parameters/OrderTypeQueryParam'
           
        responses:
          '200':
            description: | 
              Sucess
              
              Subaccounts list.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SubAccountListSucessResponsetBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * page_should_be_integer
              * page_should_be_greater_than_0
              * limit_should_be_integer
              * limit_should_be_greater_than_0
              * filter_by_active_should_be_boolean
              * ip_should_be_IPV4_format
              * order_by_can_only_be_email_or_last_used
              * ordertype_should_be_asc_or_desc
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'  
              
          '404':
                description: |
                  Not Found
                  
                  Page not found.
                content:
                  application/json:
                    schema:
                      $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                    example: 
                      message: "page_not_found"               

    
    EmailExists:
      get:
        operationId: checkIfAccountEmailExists
        tags:
          - subaccounts
        summary: Check if account email exists in turboSMTP
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Check if account email exists in turboSMTP
        
        parameters:
          - $ref: './Shared.yaml#/components/parameters/EmailQueryParam'
          
        responses:
          '200':
            description: | 
              Sucess
              
              Returns true if email address is already associated to a turboSMTP account. 
            content:
                  application/json:
                    schema:
                      $ref: './Shared.yaml#/components/schemas/CommmonResultResponseBody'
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * missing_required_parameter_email
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'           
                      
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
    
    Subaccount:
      get:
        operationId: getSubaccountDetails
        tags:
          - subaccounts
        summary: Get sub account details
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Get sub account details.
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'
        responses:
          '200':
            description: Sub account details.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Subaccount'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
          '404':
            $ref: '#/components/responses/SubaccountNotFound'  
            
      patch:
        operationId: updateSubaccountDetails      
        tags:
          - subaccounts
        summary: Update sub account details
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Update sub account details.
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'         
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountUpdateRequest'         
        responses:
          '200':
            description: Sub account updated sucessfully.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Subaccount'   
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * password_length_should_not_be_less_than_10_characters
              * password_should_contain_at_least_one_uppercase_character
              * password_should_contain_at_least_one_digit
              * password_should_equal_confirm_password
              * ip_should_be_IPV4_format
              * ip_not_associated_to_user_account
              * policy_agree_should_be_true
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
          '404':
            $ref: '#/components/responses/SubaccountNotFound'               
          
           
    CreateSubaccount:
      post:
        operationId: createSubaccount
        tags:
          - subaccounts
        summary: Create Subaccount.
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Create subaccount.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountCreateRequest'
        responses:
          '201':
            description: Sub account details.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Subaccount'   
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * email_is_already_in_use
              * missing_required_parameter_email
              * missing_required_parameter_first_name
              * missing_required_parameter_last_name
              * missing_required_parameter_password
              * password_length_should_not_be_less_than_10_characters
              * password_should_contain_at_least_one_uppercase_character
              * password_should_contain_at_least_one_digit
              * missing_required_parameter_confirm_password
              * password_should_equal_confirm_password
              * missing_required_parameter_ip
              * ip_should_be_IPV4_format
              * ip_not_associated_to_user_account
              * policy_agree_should_be_true
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
                  
    LoginAsSubaccount:
      post:
        operationId: SubaccountAuthenticationLogin      
        tags:
          - subaccounts
        summary: Login to a subaccount
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Login to a subaccount.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: './Shared.yaml#/components/schemas/Email'         
        responses:
          '200':
            description: | 
              Sucess
              
              User logged in sucessfully, use the auth value as API Key from request body in future API calls.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthenticationLoginSuccessResponsetBody' 
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * missing_required_parameter_email
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            description: |
              Forbidden
            
              Email address or password provided are incorrect.
  
              ###### Produces: 
              
              * wrong_credentials_specified
              * feature_not_available_for_active_plan
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                example: 
                  message: "wrong_credentials_specified"             
    
    
    GetActivePlan:
      get:
        operationId: getActivePlan      
        tags:
          - subaccounts
        summary: Get subaccount active plan.
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Get subaccount active plan.
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'       
        responses:
          '200':
            description: Login successfull
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SubaccountActivePlan'   
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
          '404':
            $ref: '#/components/responses/SubaccountNotFound'               
    
    UpdateSubaccountSMTPLimit:
      post:
        operationId: UpdateSubaccountSMTPLimit      
        tags:
          - subaccounts
        summary: Set subaccount smtp limit
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Set subaccount smtp limit.
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'           
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountSMTPLimit'         
        responses:
          '200':
            description: Subaccount smtp limit set sucessfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SubaccountActivePlan'   
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * missing_required_parameter_limit
              * limit_should_be_integer
              * limit_should_not_be_higher_than_parent_account_limit
              * limit_should_not_be_lower_than_-1
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
          '404':
            $ref: '#/components/responses/SubaccountNotFound'   

    UpdateSubaccountStatus:
      post:
        operationId: UpdateSubaccountStatus      
        tags:
          - subaccounts
        summary: Set subaccount status
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Set subaccount status.
        parameters:
          - $ref: './Shared.yaml#/components/parameters/IdParam'           
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountActiveStatus'         
        responses:
          '200':
            description: Subaccount status set sucessfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SubaccountActivePlan'   
          '400':
            description: |
              Bad Request
  
              ###### Produces:
  
              * missing_required_parameter_active
              * active_should_be_boolean 
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'
          '403':
            $ref: './Shared.yaml#/components/responses/ForbiddenForActivePlan'
          '404':
            $ref: '#/components/responses/SubaccountNotFound'   
    
    Logo:
      post:
        operationId: uploadLogoFile      
        tags: 
          - subaccounts
        summary: Upload agency logo
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Upload agency logo.
           
           Logo must be a png or jpeg image.
           
        
        requestBody:
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  file:
                    type: string
                    format: binary        
        
        responses:
          '200':
            description: | 
              Sucess
              
              The Logo file was successfully submitted.
              
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * missing_upload_file
              * file_type_should_be_png_or_jpeg

            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'                  
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'
      get:
        operationId: getLogoFile
        tags:
          - subaccounts   
        summary: Get agency logo
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Get agency logo
        
        responses:
          '200':
            $ref: '#/components/responses/LogoSuccess'        
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

      delete:
        operationId: deleteLogoFile
        tags:
          - subaccounts
        summary: Delete agency logo
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Delete agency logo
        responses:
          '200':
            description: | 
              Sucess
              
              Logo was deleted.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '404':
              description: |
                Not Found
                
                Agency Logo was not found.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "logo_not_found"                    
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'             

    Agency:
      get:
        operationId: getAgencySettings
        tags:
          - subaccounts
        summary: Update Agency details
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Get Agency details.
        responses:
          '200':
            description: Agency details.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AgencySettings'
          '401':
            $ref: './Shared.yaml#/components/responses/Unauthorized'

      patch:
        operationId: updateAgencySettings      
        tags: 
          - subaccounts
        summary: Update Agency details
        security:
          - ApiKeyAuth: [ ]
          - consumerKey: [ ]
            consumerSecret: [ ]           
        description: |
           
           Update Agency Details
        
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAgencySettings'        
        
        responses:
          '200':
            description: | 
              Sucess
              
              Agency details updated sucessfully
              
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'
          '400':
            description: |
              Bad Request
              
              ###### Produces:
              
              * agency_name_should_be_shorter_than_128_characters
              * agency_website_should_be_shorter_than_128_characters
              * agency_footer_should_be_shorter_than_2048_characters

            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonBadRequestResponseBody'                  
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized' 

    
  ####################
  # Common data models
  ####################
  schemas:
    AuthenticationLoginSuccessResponsetBody:
              properties:
                  auth:
                    type: string
                    description: "API Key to be used in authorization header"
              example: 
                auth: "f8efa7be4e7457c463e8b800e1f11f92072d272c"    
  
  
    ##Base
    SubaccountIP:
        type: object
        properties:
            ip:
              type: string
              description: IP address to use for sending emails.
              example: "185.228.36.19"    
    
    SubaccountSMTPLimit:
      type: object
      properties:
            limit:
              type: integer
              example: 2000
              description: The ammount of emails the sub account is allowed to send over the period specified by plan_limit_interval. Value -1 means no limit.
      required: 
        - limit    
    
    SubaccountActiveStatus:
      type: object
      properties:
            active: 
              type: boolean
              description: Active subaccounts can be used for login purpose, while users can´t login to inactive subaccounts. Notice that in order to be able to send emails the subaccount subscription must also be active. User can set subaccounts to active / inactive from the dashboard.
              example: true
      required: 
        - active    
    
    SubaccountBase:
      allOf:
        - $ref: '#/components/schemas/SubaccountIP'
        - type: object
          properties:
            first_name:
              type: string
              description: subaccount owner first name
              minLength: 1
              maxLength: 50
              example: "Andrea"
            last_name:
              type: string
              description: subaccount owner last name
              minLength: 1
              maxLength: 50
              example: "Willems"
            address_1:
              type: [string, "null"]
              description: Address Line 1
              example: 51 Guild Street
              maxLength: 255
            address_2:
              type: [string, "null"]
              description: Address Line 2
              example: 1st Floor
              maxLength: 255
            city:
              type: [string, "null"]
              description: City
              example: London
              maxLength: 100
            company_name:
              type: [string, "null"]
              description: Agency Name
              example: Refreshing Soda Inc.
              maxLength: 100
            country:
              type: [string, "null"]
              description: Country
              example: United Kingdom
              maxLength: 64
            region:
              type: [string, "null"]
              description: Region
              example: West
              maxLength: 100
            zip_code:
              type: [string, "null"]
              description: Zip Code
              example: NW10 9NQ
              maxLength: 10
            phone_number:
              type: [string, "null"]
              description: Phone Number
              example: "5493513164544"
              maxLength: 30
            policy_agree:
              type: boolean
              description: Policy must be agreed in order to be able to create a subaccount.
              example: true
            site_url:
              type: [string, "null"]
              description: Website
              example: https://www.refreshing-soda.com
              maxLength: 45              
  
    SubaccountIDStatusBase:
      allOf:
        - $ref: '#/components/schemas/SubaccountIP'
        - $ref: '#/components/schemas/SubaccountActiveStatus'
        - type: object
          properties:
            subaccount_id:
              type: integer
              example: 19302132
              description: Sub account Id
            parent_id:
              type: integer
              example: 19334162
              description: Sub account parent Id  

    SubaccountPlanBase:
      allOf:
        - $ref: '#/components/schemas/SubaccountSMTPLimit'
        -  type: object
           properties:
              sent:
                type: integer
                example: 125
                description: The ammount of sent emails from the sub account over the current period.        
              last_used:
                $ref: './Shared.yaml#/components/schemas/NullableCustomDateTimeFormat'
                example: 2021-03-17 00:00:00
                description: The date time the sub account was last used.
              plan_expiration:
                $ref: './Shared.yaml#/components/schemas/NullableCustomDateTimeFormat'
                example: 2023-01-17 00:00:00
                description: Expiration date time of the plan.
              plan_limit_interval:
                $ref: '#/components/schemas/SmtpLimitInterval'
              expired: 
                type: boolean
                example: false
                description: Expired if plan expiration date is overdue.

    SubaccountPasswordConfirmPassword:
        type: object
        additionalProperties: false
        properties:
            password:
              type: string
              description: subaccount password
              minLength: 10
              example: "LetmeIn123!"
            confirm_password:
              type: string
              description: subaccount confirm password
              minLength: 10
              example: "LetmeIn123!"

    SubaccountPasswordConfirmPasswordOptional:
        type: object
        properties:
            password:
              type: string
              description: subaccount password
              minLength: 10
              example: "LetmeIn123!"
            confirm_password:
              type: string
              description: subaccount confirm password
              minLength: 10
              example: "LetmeIn123!"
  
    SmtpLimitInterval:
      type: string
      enum: [ 'Daily', 'Monthly', 'Yearly' ]
      example: Monthly
      description: |
          Limit interval that specifies if the sub account sending limit is specified daily, monthly or yearly.
          
          * Important Note: The limit interval allways follows the main account limit.
        
        
      
    
    ##BaseEnd
  
    Subaccount:
      unevaluatedProperties: false
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - $ref: '#/components/schemas/SubaccountIDStatusBase'
        - $ref: '#/components/schemas/SubaccountBase'
      example:
        active: true
        email: client@clientdomain.com
        subaccount_id: 19302132
        parent_id: 22190623
        ip: 185.228.36.19
        first_name: Andrea
        last_name: Willems
        address_1: ''
        address_2: ''
        city: ''
        company_name: Refreshing Soda Inc.
        country: ''
        region: ''
        zip_code: ''
        phone_number: ''
        policy_agree: true
        site_url: ''

    SubaccountCreateRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - $ref: '#/components/schemas/SubaccountBase'
        - $ref: '#/components/schemas/SubaccountPasswordConfirmPassword'
      required:
        - email
        - password
        - confirm_password
        - first_name
        - last_name
        - ip
        - policy_agree

    SubaccountUpdateRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SubaccountBase'
        - $ref: '#/components/schemas/SubaccountPasswordConfirmPasswordOptional'
      required:
        - first_name
        - last_name
        - ip
        - policy_agree

    SubaccountListItem:
      unevaluatedProperties: false
      allOf:
        - $ref: './Shared.yaml#/components/schemas/Email'
        - $ref: '#/components/schemas/SubaccountIDStatusBase'
        - $ref: '#/components/schemas/SubaccountIP'
        - $ref: '#/components/schemas/SubaccountPlanBase'

    SubAccountListSucessResponsetBody:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SubaccountListItem'
      example:
                    count: 2
                    results:
                      - active: true
                        email: subaccount-1@yourdomain.om
                        subaccount_id: 19302132
                        parent_id: 22190623
                        ip: 199.244.75.250
                        last_used: 2022-11-20 22:44:07
                        limit: 16
                        plan_expiration: 2023-01-17 00:00:00
                        sent: 2
                        plan_limit_interval: Monthly
                        expired: false
                      - active: true
                        email: subaccount-2@yourdomain.om
                        subaccount_id: 19302133
                        parent_id: 22190623
                        ip: 199.244.75.250
                        last_used: 2022-11-19 21:04:07
                        limit: 50
                        plan_expiration: 2023-01-17 00:00:00
                        sent: 34
                        plan_limit_interval: Monthly
                        expired: false       

    SubaccountActivePlan:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/SubaccountIDStatusBase'
        - $ref: '#/components/schemas/SubaccountIP'
        - $ref: '#/components/schemas/SubaccountPlanBase'
      example:
        subaccount_id: 19302132
        parent_id: 22190623
        ip: 199.244.75.250
        active: true
        limit: 2000
        sent: 0
        last_used: null
        plan_expiration: 2023-01-17 00:00:00
        plan_limit_interval: Monthly
        expired: false

    Logo:
      type: object
      properties:
        logoUrl:
          type: string    
              
    BaseAgencySettings:
      type: object
      properties:
        agency_name: 
          type: string
          description: Agency Name
          example: My Agency Inc.
          maxLength: 128
        agency_website: 
          type: string
          description: Agency Website
          example: https://www.mywebsite.com
          maxLength: 128
        agency_footer:
          type: string
          description: Footer to be used 
          example: My signature goes here.
          maxLength: 2048
    
    AgencySettings:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Logo'
        - $ref: '#/components/schemas/BaseAgencySettings'
      example:
        logoUrl: https://turbosmtp.s3.amazonaws.com/logo/default_logo.svg
        agency_name: My Agency Inc.
        agency_website: https://www.mywebsite.com
        agency_footer: My signature goes here.

  ####################
  # Common parameters
  ####################
  parameters:
    SubaccountFilterByEmailQueryParam:
      in: query
      name: filter_by_email
      required: false
      schema:
        description: Filter by email addresses that fully/partially match the search value.
        type: string
        example: 'Jhon'      
      description: Filter by email addresses that fully/partially match the search value.

    SubaccountFilterByActiveQueryParam:
      in: query
      name: filter_by_active
      required: false
      schema:
        description: Filter by subaccount active/inactive status (true=active, false=inactive).
        type: boolean
        example: true
      description: Filter by subaccount active/inactive status. Accepts boolean values (true or false).

    SubaccountFilterByIPQueryParam:
      in: query
      name: filter_by_ip[]
      required: false
      style: form
      explode: true
      schema:
        description: Filter by IPv4 addresses. Multiple IPs can be provided. Valid IPv4 format (e.g., 192.168.1.1).
        type: array
        items:
          type: string
          pattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$'
      description: Filter by IPv4 addresses (e.g., 192.168.1.1). Multiple IPs can be provided.
      
    SubaccountOrderByQueryParam:
      in: query
      name: order_by
      required: false
      schema:
        description: Field to sort by
        type: string
        enum: [ 'email', 'last_used']
        default: 'email'
        example: 'email'
      description: Field to sort by


  #######################
  # Common request bodies
  #######################

  ####################
  # Common responses
  ####################
  responses:
      SubaccountNotFound:
                description: |
                  Not Found
                  
                  Please verify the subaccount id is valid.
                content:
                  application/json:
                    schema:
                      $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                    example: 
                      message: "subaccount_not_found"
                      
      LogoSuccess:
                description: |
                  Agency Logo Url
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Logo'

