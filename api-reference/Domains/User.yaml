# OpenAPI version identifier - required for OpenAPI 3.1 domains
openapi: 3.1.0

#######################
# Optional info section
#######################
info:
  title: User Components
  description: User components for TurboSMTP REST APIs
  version: '1.0.0-oas3'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:   
- description: turboSMTP Production Server
  url: https://pro.api.serversmtp.com/api/v2

security:
  - ApiKeyAuth: []

# Empty paths section - required for OpenAPI 3.0 structure
paths: {}

components:

  #######################
  # Common path items
  #######################
  pathItems:
    UserInfo:
      get:
        security:
          - ApiKeyAuth: [ ]
        tags:
          - user          
        summary: Get user details
        operationId: getUserInfo
        description: |
          Get user details
        responses:
          '200':
            description: | 
              Sucess
              
              Personal billing details.  
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/UserDetails'
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'

    ConsumerKeys:
      get:
        operationId: listConsumerKeys
        tags:
          - consumerkey
        summary: Get Consumer Keys list
        security:
          - ApiKeyAuth: [ ]
        description: |
           
           Get Consumer Keys list
           
           Note: Consumer Keys listing is not allwed when authenticated via Consumer Key.

        responses:
          '200':
            description: | 
              Sucess
              
              Consumer Keys list
              
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ConsumerKeyListSucessResponsetBody'

          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'
      post:
        operationId: createConsumerKey
        tags:
          - consumerkey
        summary: Create Consumer Key
        security:
          - ApiKeyAuth: [ ]
        description: |
           
           Create new Consumer Key

           Note: Consumer Key creation is not allwed when authenticated via Consumer Key.

        requestBody:
          required: true
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ConsumerKeyCreateRequestBody'
           
        responses:
          '201':
            description: | 
              Sucess
              
              Consumer Key Created Sucessfully.
              
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ConsumerKeyCreateResponseBody'
            links:
              DeleteConsumerKey:
                operationId: deleteConsumerKey
                parameters:
                  consumerKey: '$response.body#/consumerKey'
          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'

    ConsumerKeysID:  
      delete:
        operationId: deleteConsumerKey
        tags:
          - consumerkey
        summary: Delete Consumer Key
        security:
          - ApiKeyAuth: [ ]
        description: |
           
           Delete Consumer Key
           Note: Consumer Key deletion is not allwed when authenticated via Comsumer Key.

        parameters:
          - $ref: '#/components/parameters/ConsumerKeyPathParam'

        responses:
          '200':
            description: | 
              Sucess
              
              Consumer Key was deleted.
            content:
              application/json:
                schema:
                  $ref: './Shared.yaml#/components/schemas/CommonSuccessResponseBody'

          '401':
              $ref: './Shared.yaml#/components/responses/Unauthorized'
              
          '404':
              description: |
                Not Found
                
                Please verify the Consumer Key is valid.
              content:
                application/json:
                  schema:
                    $ref: './Shared.yaml#/components/schemas/CommonMessageResponseBody'
                  example: 
                    message: "key_not_found" 

